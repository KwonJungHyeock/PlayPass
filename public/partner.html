<!doctype html>
<html lang="ko">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover" />
    <title>비빔핏 파트너 센터</title>
    <link rel="stylesheet" href="/css/style.css" />
  </head>
  <body>
    <svg width="0" height="0" style="position:absolute" aria-hidden="true">
      <symbol id="bowl" viewBox="0 0 40 40">
        <circle cx="14" cy="11" r="2.7" />
        <circle cx="20" cy="8.4" r="2.7" />
        <circle cx="26" cy="11" r="2.7" />
        <rect x="5" y="16" width="30" height="3.4" rx="1.7" />
        <path d="M7.5 20 a12.5 10.5 0 0 0 25 0 z" />
      </symbol>
    </svg>
    <div class="app" style="padding-bottom:0">
      <header class="appbar">
        <span class="logo-lockup">
          <span class="logo-mark"><svg class="bowl"><use href="#bowl" /></svg></span>
          <b>파트너 센터</b>
        </span>
        <span class="spacer"></span>
        <a class="ghost-btn" href="/app">사용자 앱 ›</a>
      </header>

      <div class="p-wrap">
        <div class="partner-head">
          <label>운영 시설</label>
          <select id="facilitySelect"></select>
          <div class="hint" id="facilityHint"></div>
        </div>

        <div class="stat-grid" id="statGrid"></div>

        <div class="panel">
          <h3>📊 요일별 예약 현황</h3>
          <div id="dayChart"></div>
        </div>

        <div class="panel">
          <h3>⏰ 시간대별 예약 현황</h3>
          <div id="slotChart"></div>
        </div>

        <div class="panel">
          <h3>🙋 실시간 예약 · 출석 관리</h3>
          <div class="table-wrap">
            <table class="res">
              <thead>
                <tr><th>회원</th><th>클래스</th><th>일정</th><th>상태</th><th>출석</th></tr>
              </thead>
              <tbody id="resBody"></tbody>
            </table>
          </div>
        </div>

        <div class="panel">
          <h3>🎉 프로모션 툴</h3>
          <div id="promoList"></div>
          <div class="form-inline">
            <select id="promoType">
              <option value="timesale">타임세일</option>
              <option value="newbie">신규 가입 이벤트</option>
              <option value="custom">직접 입력</option>
            </select>
            <input type="text" id="promoTitle" placeholder="프로모션 제목" />
            <input type="text" id="promoDesc" placeholder="설명 (예: 평일 오후 방문 시 30% 할인)" />
            <input type="text" id="promoPct" placeholder="할인율 % (숫자만)" />
            <button class="btn-primary" id="addPromo">프로모션 등록</button>
          </div>
        </div>

        <div class="p-foot">© 2026 비빔핏 파트너 센터 · Phase 1 MVP</div>
      </div>
    </div>

    <div class="toast" id="toast"></div>
    <script src="/js/partner.js"></script>
  </body>
</html>
