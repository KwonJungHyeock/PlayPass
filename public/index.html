<!doctype html>
<html lang="ko">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>플레이패스 · 전주의 모든 운동을 내 손안에</title>
    <link rel="stylesheet" href="/css/style.css" />
  </head>
  <body>
    <header class="topbar">
      <div class="topbar-inner">
        <a href="/" class="logo">
          <span class="mark">P</span>
          <span>PlayPass<small>전주 스포츠 통합 플랫폼</small></span>
        </a>
        <nav class="nav">
          <a href="/" class="active">둘러보기</a>
          <a href="/partner.html">파트너 센터</a>
        </nav>
      </div>
    </header>

    <main class="wrap">
      <section class="hero">
        <h1>전주의 모든 운동을 내 손안에 🏃</h1>
        <p>에어로빅부터 주짓수까지 — 전주 전역의 운동 시설을 한 곳에서 비교하고 바로 등록하세요.</p>

        <div class="persona">
          <label>내 연령대</label>
          <select id="ageSelect">
            <option value="">선택 안 함</option>
          </select>
          <label>내 위치</label>
          <select id="locSelect">
            <option value="">위치 미설정</option>
            <option value="35.8461,127.1299">전북대 (덕진구)</option>
            <option value="35.8242,127.1480">전주시청</option>
            <option value="35.8158,127.1131">효자동</option>
            <option value="35.7961,127.1321">평화동</option>
            <option value="35.8683,127.1351">송천동</option>
          </select>
          <button id="geoBtn" class="sortbtn">📍 현재 위치</button>
        </div>
      </section>

      <section class="zones">
        <h3>📍 지역 큐레이션 <small>전주를 구·동 단위로 쪼갠 맞춤 존</small></h3>
        <div id="zoneGroups"></div>
        <div class="zone-banner" id="zoneBanner" hidden></div>
      </section>

      <section class="reco" id="dealsSection" hidden>
        <h3>⚡ <span id="dealsTitle">마감 임박 특가</span> <small>유휴 시간대를 특가로!</small></h3>
        <div class="reco-scroll" id="dealsScroll"></div>
      </section>

      <section class="reco" id="recoSection" hidden>
        <h3>✨ <span id="recoTitle">맞춤 추천</span></h3>
        <div class="reco-scroll" id="recoScroll"></div>
      </section>

      <div class="chips" id="chips"></div>

      <div class="toolbar">
        <div class="search">
          <input type="text" id="searchInput" placeholder="시설명, 지역, 태그로 검색 (예: 볼더링, 효자동)" />
        </div>
        <div class="sortbtns" id="sortbtns">
          <button class="sortbtn active" data-sort="rating">후기순</button>
          <button class="sortbtn" data-sort="price">가격순</button>
          <button class="sortbtn" data-sort="distance">거리순</button>
        </div>
      </div>

      <div class="grid" id="grid"></div>

      <section class="hub">
        <h3>🧩 플레이패스 허브 <small>공간을 넘어 경험·커머스·웰니스까지</small></h3>
        <div class="hub-grid" id="hubGrid"></div>
      </section>

      <div class="footer">
        © 2026 PlayPass · 전주 로컬 스포츠 생태계 · Phase 1 MVP
      </div>
    </main>

    <div class="modal-backdrop" id="modalBackdrop">
      <div class="modal" id="modal"></div>
    </div>

    <div class="toast" id="toast"></div>

    <script src="/js/app.js"></script>
  </body>
</html>
